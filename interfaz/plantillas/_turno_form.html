{# T231: alta / edicion de un turno de la tabla. #}
<form class="panel turno-form" hx-post="/turnos/guardar" hx-target="#turnos-tabla" hx-disabled-elt="find button[type=submit]">
  <h3>{% if t.id %}Editar «{{ t.nombre }}»{% else %}Nuevo turno{% endif %}</h3>
  {% if error %}<p class="nota nota-bloqueo" role="alert">{{ error }}</p>{% endif %}
  <input type="hidden" name="id" value="{{ t.id }}">
  <div class="campos">
    <label class="campo-ancho">Nombre
      <input name="nombre" value="{{ t.nombre }}" maxlength="60" required autocomplete="off" placeholder="p. ej. Revisión nocturna">
    </label>
    <label class="campo-ancho">Plantilla
      <select name="plantilla">
        {% for p in plantillas %}<option value="{{ p.id }}"{% if t.plantilla == p.id %} selected{% endif %}>{{ p.nombre }}{% if p.solo_lectura %} (solo lectura){% endif %}</option>{% endfor %}
      </select>
    </label>
    <label class="campo-ancho">Instrucciones personalizadas (opcional; vacío = el texto de la plantilla)
      <textarea name="instrucciones" rows="3" maxlength="{{ max_texto }}">{{ t.instrucciones }}</textarea>
    </label>
    <label class="campo-ancho">Tareas concretas (opcional; para «cola», «investigación» y «correcciones»)
      <input name="tareas" value="{{ t.tareas|join(', ') }}" autocomplete="off" placeholder="T123, T145">
    </label>
  </div>
  <fieldset class="turno-dias">
    <legend>Días</legend>
    {% for d in dias %}
    <label><input type="checkbox" name="dias" value="{{ d }}"{% if d in t.dias %} checked{% endif %}>
      {{ {"miercoles": "miércoles", "sabado": "sábado"}.get(d, d) }}</label>
    {% endfor %}
  </fieldset>
  <div class="campos">
    <label>Hora(s) (HH:MM, separadas por comas)
      <input name="horas" value="{{ t.horas|join(', ') }}" required autocomplete="off" inputmode="numeric">
    </label>
    <label>Tope de tareas
      <select name="max_tareas">{% for n in range(1, max_tareas + 1) %}<option value="{{ n }}"{% if t.max_tareas == n %} selected{% endif %}>{{ n }}</option>{% endfor %}</select>
    </label>
    <label>Tope de minutos
      <input name="max_minutos" type="number" min="{{ min_minutos }}" max="{{ max_minutos }}" value="{{ t.max_minutos }}" required>
    </label>
  </div>
  <div class="turno-casillas">
    <label><input type="checkbox" name="avisar" value="si"{% if t.avisar %} checked{% endif %}> Avisarme al terminar</label>
    <label><input type="checkbox" name="activo" value="si"{% if t.activo %} checked{% endif %}> Activo</label>
  </div>
  <div class="fila-botones">
    <button type="submit">Guardar</button>
    <button type="button" class="boton-sutil" hx-get="/turnos/cerrar-form" hx-target="#turno-form">Cancelar</button>
  </div>
</form>
