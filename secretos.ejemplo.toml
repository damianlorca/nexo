# T039: para que /ahora (pedirle un turno a Claude sin esperar al
# cron de las 23:00) funcione, hace falta un token PROPIO DE LA
# RUTINA, no la API key normal de pago. Se genera una sola vez a
# mano:
#   1. Entra en claude.ai/code/routines con tu cuenta.
#   2. Abre la rutina "Nexo — turno de noche".
#   3. Añade un "disparador de API" (API trigger) y copia el token
#      que te da (empieza por sk-ant-oat01-...).
#   4. Pégalo aquí abajo en token_api.
# Se factura contra tu plan de Claude Code, igual que un turno
# normal — no es la API de pago aparte, así que no rompe la regla
# de coste cero. Sin esto relleno, /ahora simplemente te explica
# estos mismos pasos y no llama a ningún sitio.
[rutina]
token_api = "PEGA_AQUI_EL_TOKEN_sk-ant-oat01-..._DE_LA_RUTINA"
id = "trig_01Txbm61guxCznJ8m2wrRrci"

