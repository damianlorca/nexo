[canal]
# El token del bot va en secretos.toml
# T751: interruptor del bot de Telegram. false = el vigilante no lo relanza y el bot sale en su siguiente
# vuelta (no se borra codigo; true lo vuelve a encender). Las aprobaciones ambar avisan por push y se deciden
# en la web (Bandejas).
bot_activo = false
chat_id = 0

# Desde el 11/09: cuando llega un mensaje suelto (no contesta a una
# pregunta abierta), el bot manda ademas una lectura rapida de Qwen
# (categoria, urgencia, resumen de una frase) en un segundo mensaje
# sin sonido. Qwen NO decide ni da de alta nada por su cuenta, solo
# informa mientras Nexo no esta mirando. Ponlo a false si molesta.
qwen_responde_libres = true

# T073 (14/09): ademas de esa lectura informativa, un mensaje suelto
# que Qwen clasifica como "resumen" se intenta de verdad con el
# Router (router.py, T067/T044), con la misma verificacion mecanica.
# N01 (H11, 26/09): SOLO con Qwen local (solo_local=True): nunca sale
# a ChatGPT ni a Gemini, y con la PARADA activa no se intenta. Una "extraccion" no puede resolverse desde un mensaje
# suelto (no hay claves que pedirle a Telegram) y siempre escala sin
# mandar nada. Ponlo a false si prefieres que TODO mensaje suelto
# quede solo para que Nexo (Claude) lo revise a mano.
router_responde_libres = true
