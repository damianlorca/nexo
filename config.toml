    "C:\\Users\\damia\\Desktop\\AI\\agente",
    "C:\\Users\\damia\\Desktop\\AI\\ComfyUI",
    # Vault de NEXO (documentacion). Aprobado por Damian 23/09/2026 ("si, vault").
    "C:\\Users\\damia\\Desktop\\AI\\contexto\\proyectos\\nexo",
]
# Todo lo de fuera es ámbar. El rojo no se configura: está fijo en el código.

[qwen]
# Ollama primero: arranca como servicio y funciona sin que haya
# ninguna ventana abierta, que es lo que hace falta para trabajar
# cuando Damián no está. LM Studio queda de reserva.
url = "http://localhost:11434/v1"
url_reserva = "http://localhost:1234/v1"   # LM Studio, si Ollama no responde

# Contexto de Ollama (API nativa /api/chat). CLAUDE.md: num_ctx 4096.
# Sin esta linea extremidades/qwen.py pedia 8192 (hallazgo B2 de N02, 25/09).
num_ctx = 4096

# MEDIDO el 11/09/2026 con tres encargos cortos y el mismo
# presupuesto de 800 tokens:
#
#     qwen3:4b      116,1 s    3 de 3 respuestas VACIAS
#     qwen2.5:7b     15,9 s    0 vacias
#     llama3.2:3b    26,4 s    0 vacias
#
# El obrero era qwen3:4b, el unico que no contestaba. qwen3 razona
# antes de responder y ese razonamiento sale del mismo presupuesto:
# para contestar una palabra se lo gasta entero pensando. Para faena
# corta, un modelo que razona es lo peor que se puede poner.
#
# Detalle en memoria/comparativa_modelos.json.
modelo_obrero = "qwen2.5:7b"     # faena mecánica: resumir, clasificar, limpiar
# Decision 6 (26/09): nada de mas de 8B sin Damian delante. El 14B de antes
# (qwen3:14b) sigue instalado, pero ya no se carga solo.
modelo_criterio = "qwen2.5:7b"   # cuando hace falta algo de juicio (<=8B)

# Reserva: nombres tal y como los tiene LM Studio.
modelo_obrero_reserva = "qwen/qwen3-4b"
modelo_criterio_reserva = "qwen/qwen3-4b"

# Con 32 GB compartidos entre CPU y la 890M, el 14B (unos 9 GB en q4)
# y ComfyUI (unos 7 GB) caben a la vez. No lances los dos con el 14B
# cargado si además estás con SolidWorks abierto.

[imagen]
comfyui = "http://127.0.0.1:8188"

# MEDIDO el 12/09/2026 (pruebas/prueba_directml.py): la Radeon 890M solo
# admite unos 3 GB por DirectML. SDXL Turbo (UNet de ~5 GB en fp16) NO cabe
# y hace que ComfyUI muera con un "UnicodeDecodeError ... byte 0xe1" que
# parece un fallo de texto pero es falta de memoria de GPU disfrazada.
# Por eso el checkpoint de trabajo es sd-turbo (SD 2.1, ~2,6 GB en fp16),
# que sí entra. El de SDXL sigue en disco por si algún día se usa en CPU:
#   sd_xl_turbo_1.0_fp16.safetensors
checkpoint = "sd_turbo.safetensors"

# sd-turbo está entrenado a 512 px y con muy pocos pasos; cfg alto lo
# estropea (para eso está el "turbo"). No subas cfg por encima de 2.
ancho = 512
alto = 512
pasos = 4
cfg = 1.0

[video]
# Divulgación en vertical y corto: reels y shorts.
vertical = true
ancho = 1080
alto = 1920

[altavoz]
# T697: oyente del altavoz "Damián" (extremidades/altavoz.py): al ver el volumen al 13 % lo devuelve al de antes
