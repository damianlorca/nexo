[nvidia]
# La clave va en secretos.toml [nvidia] api_key. Esta lista no es secreta:
# ids exactos comprobados contra /models el 27-28/09/2026 (documentacion/proveedores/NVIDIA_MODELOS_GRATIS.md).
# 04/10 (T667, Damian): fuera mistral-nemotron (HTTP 410, retirado) y glm-5.3-flash (sin respuesta en 120 s);
# dentro nemotron-3-ultra (Free Endpoint, banco herramientas_nube/_banco_tribunal_0410.py OK).
# 24/10 (bloque 18): super-120b da 404 y gpt-oss-20b no responde; ultra primero, el resto con "Free Endpoint" y
